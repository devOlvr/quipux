# Quarkus
quarkus.http.port=8081

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:personsdb}

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=update

# REST Client
quarkus.rest-client.nationalize-api.url=https://api.nationalize.io
quarkus.rest-client.nationalize-api.scope=jakarta.inject.Singleton

# Auth
app.api-key=${API_KEY:quipux-secret-key}

# OpenAPI / Swagger
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Person API - Quipux
quarkus.smallrye-openapi.info-version=1.0.0

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
